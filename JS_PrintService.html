<script>
/* ============================================================
   JS_PrintService.html — Daily Sub Printout Generation
   ============================================================ */

const PrintService = (() => {

  // ── Open print date picker modal ─────────────────────────────
  function openModal() {
    const today = new Date();
    const yyyy  = today.getFullYear();
    const mm    = String(today.getMonth() + 1).padStart(2, "0");
    const dd    = String(today.getDate()).padStart(2, "0");
    const todayStr = `${yyyy}-${mm}-${dd}`;

    UI.openModalWith(`
      <h2 style="font-family:var(--font-display);font-size:20px;margin-bottom:6px;">Print Daily Sub Sheet</h2>
      <p style="color:var(--text-3);font-size:13px;margin-bottom:24px;">Select a date to generate the sub assignment printout.</p>

      <div class="form-group">
        <label class="form-label">Date</label>
        <input type="date" class="form-input" id="print-date" value="${todayStr}" />
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="btn btn-primary" style="flex:1" onclick="PrintService.generateAndPrint()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Generate & Print
        </button>
        <button class="btn btn-secondary" onclick="UI.closeModal()">Cancel</button>
      </div>
    `);
  }

  // ── Generate HTML and trigger print ──────────────────────────
  function generateAndPrint() {
    const dateInput = document.getElementById("print-date");
    if (!dateInput || !dateInput.value) {
      UI.toast("Please select a date.", "warning");
      return;
    }

    const dateStr = dateInput.value;
    const { iepRequests, periodTimes, scheduleTypes } = App.getState();

    // Filter requests for this date
    const dayRequests = iepRequests.filter(r => r.Date === dateStr && r.Status !== "Cancelled");

    if (dayRequests.length === 0) {
      UI.toast("No active IEP requests for this date.", "info");
      return;
    }

    // Build period time lookup per schedule
    const ptLookup = {};
    periodTimes.forEach(pt => {
      if (!ptLookup[pt.ScheduleID]) ptLookup[pt.ScheduleID] = {};
      ptLookup[pt.ScheduleID][String(pt.Period)] = `${pt.StartTime}–${pt.EndTime}`;
    });

    // Format date nicely
    const dateObj = new Date(dateStr + "T12:00:00");
    const dateFormatted = dateObj.toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });

    // Group by sub
    const bySubID = {};
    const unassigned = [];

    dayRequests.forEach(req => {
      if (req.AssignedSubID) {
        if (!bySubID[req.AssignedSubID]) {
          bySubID[req.AssignedSubID] = {
            name: req.AssignedSubName || req.AssignedSubID,
            assignments: []
          };
        }
        bySubID[req.AssignedSubID].assignments.push(req);
      } else {
        unassigned.push(req);
      }
    });

    // Build print HTML
    let printHTML = buildPrintHTML(dateFormatted, bySubID, unassigned, ptLookup, scheduleTypes);

    // Open in new window and print
    const win = window.open("", "_blank", "width=900,height=700");
    win.document.write(printHTML);
    win.document.close();
    setTimeout(() => { win.focus(); win.print(); }, 600);

    UI.closeModal();
    UI.toast("Print sheet opened.", "success");
  }

  function buildPrintHTML(dateFormatted, bySubID, unassigned, ptLookup, scheduleTypes) {
    const schedNames = {};
    scheduleTypes.forEach(s => { schedNames[s.ID] = s.Name; });

    let subSections = "";

    Object.entries(bySubID).forEach(([subID, sub]) => {
      const rows = sub.assignments.map(req => {
        const periods = (req.Periods || "").split(",").filter(Boolean).sort((a,b) => Number(a)-Number(b));
        const schedID = req.ScheduleType || "regular";
        const periodCells = periods.map(p => {
          const timeRange = ptLookup[schedID] && ptLookup[schedID][p] ? ptLookup[schedID][p] : "—";
          return `<span style="display:inline-block;border:1px solid #ccc;border-radius:4px;padding:3px 8px;margin:2px;font-size:12px;font-family:monospace;">
            P${p}: ${timeRange}
          </span>`;
        }).join("");
        return `
          <tr>
            <td style="font-weight:600;">${req.TeacherName}</td>
            <td>${req.IEPTime}</td>
            <td>${schedNames[req.ScheduleType] || req.ScheduleType || "Regular"}</td>
            <td>${periodCells}</td>
            <td>${req.Notes || "—"}</td>
          </tr>
        `;
      }).join("");

      subSections += `
        <div style="page-break-inside:avoid;margin-bottom:32px;">
          <div style="background:#1a1a2e;color:#fff;padding:12px 16px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:10px;">
            <div style="width:32px;height:32px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;">
              ${sub.name.charAt(0).toUpperCase()}
            </div>
            <div>
              <div style="font-size:16px;font-weight:700;">${sub.name}</div>
              <div style="font-size:11px;opacity:0.7;">On-Site Substitute — ${sub.assignments.length} assignment${sub.assignments.length !== 1 ? 's' : ''}</div>
            </div>
          </div>
          <table style="width:100%;border-collapse:collapse;border:1px solid #ccc;border-top:none;">
            <thead>
              <tr>
                <th style="background:#f5f5f5;padding:10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;border:1px solid #ddd;">Teacher</th>
                <th style="background:#f5f5f5;padding:10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;border:1px solid #ddd;">IEP Time</th>
                <th style="background:#f5f5f5;padding:10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;border:1px solid #ddd;">Schedule</th>
                <th style="background:#f5f5f5;padding:10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;border:1px solid #ddd;">Periods</th>
                <th style="background:#f5f5f5;padding:10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;border:1px solid #ddd;">Notes</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    });

    let unassignedSection = "";
    if (unassigned.length > 0) {
      const rows = unassigned.map(req => {
        const periods = (req.Periods || "").split(",").filter(Boolean).join(", ");
        return `
          <tr>
            <td style="padding:10px;border:1px solid #ddd;">${req.TeacherName}</td>
            <td style="padding:10px;border:1px solid #ddd;">${req.IEPTime}</td>
            <td style="padding:10px;border:1px solid #ddd;">P${periods}</td>
            <td style="padding:10px;border:1px solid #ddd;color:#d97706;font-weight:600;">⚠ Needs Sub</td>
          </tr>
        `;
      }).join("");
      unassignedSection = `
        <div style="page-break-inside:avoid;margin-bottom:32px;">
          <div style="background:#7c3aed;color:#fff;padding:12px 16px;border-radius:6px 6px 0 0;font-size:15px;font-weight:700;">
            ⚠ Unassigned Requests
          </div>
          <table style="width:100%;border-collapse:collapse;border:1px solid #ccc;border-top:none;">
            <thead>
              <tr>
                <th style="background:#f5f5f5;padding:10px;text-align:left;font-size:11px;border:1px solid #ddd;">Teacher</th>
                <th style="background:#f5f5f5;padding:10px;text-align:left;font-size:11px;border:1px solid #ddd;">IEP Time</th>
                <th style="background:#f5f5f5;padding:10px;text-align:left;font-size:11px;border:1px solid #ddd;">Periods</th>
                <th style="background:#f5f5f5;padding:10px;text-align:left;font-size:11px;border:1px solid #ddd;">Status</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    return `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>IEP Sub Sheet — ${dateFormatted}</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; font-size: 14px; color: #111; background: #fff; padding: 32px; }
    td { padding: 10px; border: 1px solid #ddd; vertical-align: top; }
    @media print {
      body { padding: 16px; }
      .no-print { display: none; }
    }
  </style>
</head>
<body>
  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;padding-bottom:16px;border-bottom:2px solid #1a1a2e;">
    <div>
      <h1 style="font-size:24px;font-weight:700;color:#1a1a2e;">Daily Sub Assignments</h1>
      <p style="font-size:14px;color:#666;margin-top:4px;">${dateFormatted}</p>
    </div>
    <div style="text-align:right;font-size:12px;color:#999;">
      <div>Printed: ${new Date().toLocaleString()}</div>
      <div style="margin-top:4px;">IEP Sub Tracker</div>
    </div>
  </div>

  ${subSections}
  ${unassignedSection}

  <div class="no-print" style="margin-top:24px;text-align:center;">
    <button onclick="window.print()" style="padding:10px 24px;background:#1a1a2e;color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:14px;cursor:pointer;">
      Print / Save as PDF
    </button>
  </div>
</body>
</html>`;
  }

  return { openModal, generateAndPrint };

})();
</script>
