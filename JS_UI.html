<script>
/* ============================================================
   JS_UI.html — View Rendering, Modal, Toast, Navigation Helpers
   ============================================================ */

const UI = (() => {

  // ── Toast ────────────────────────────────────────────────────
  function toast(message, type = "info") {
    const container = document.getElementById("toast-container");
    const icons = {
      success: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
      error:   `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
      warning: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
      info:    `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    };
    const t = document.createElement("div");
    t.className = `toast ${type}`;
    t.innerHTML = `${icons[type] || ""}<span>${message}</span>`;
    container.appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; t.style.transform = "translateX(20px)"; t.style.transition = "all 0.3s"; setTimeout(() => t.remove(), 300); }, 3500);
  }

  // ── Modal ────────────────────────────────────────────────────
  function openModalWith(html, large) {
    const overlay = document.getElementById("modal-overlay");
    const modal   = document.getElementById("modal");
    const body    = document.getElementById("modal-body");
    body.innerHTML = html;
    modal.className = "modal" + (large ? " modal-lg" : "");
    overlay.classList.add("open");
  }

  function closeModal(event) {
    if (event && event.target !== document.getElementById("modal-overlay")) return;
    document.getElementById("modal-overlay").classList.remove("open");
  }

  function openPrintModal() {
    PrintService.openModal();
  }

  // ── Sidebar Toggle ───────────────────────────────────────────
  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
  }

  // ── Dashboard ────────────────────────────────────────────────
  function renderDashboard(container) {
    const { iepRequests, teachers, subs } = App.getState();
    const today = new Date();
    const todayStr = formatDateStr(today);

    const upcoming = iepRequests.filter(r => r.Date >= todayStr && r.Status !== "Cancelled");
    const past     = iepRequests.filter(r => r.Date < todayStr);
    const pending  = upcoming.filter(r => !r.AssignedSubID || r.Status === "Pending");
    const todayReqs = upcoming.filter(r => r.Date === todayStr);

    container.innerHTML = `
      <div class="animate-in">
        <div class="stat-grid">
          <div class="stat-card accent">
            <div class="stat-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
            <div class="stat-value">${upcoming.length}</div>
            <div class="stat-label">Upcoming IEPs</div>
          </div>
          <div class="stat-card amber">
            <div class="stat-icon amber"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
            <div class="stat-value">${pending.length}</div>
            <div class="stat-label">Needs Sub</div>
          </div>
          <div class="stat-card green">
            <div class="stat-icon green"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
            <div class="stat-value">${subs.length}</div>
            <div class="stat-label">On-Site Subs</div>
          </div>
          <div class="stat-card purple">
            <div class="stat-icon purple"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
            <div class="stat-value">${past.length}</div>
            <div class="stat-label">Past Records</div>
          </div>
        </div>

        <!-- Today's requests -->
        <div style="margin-bottom:24px;">
          <div class="section-header">
            <div>
              <h2 class="section-title">Today's IEPs</h2>
              <p class="section-subtitle">${todayStr}</p>
            </div>
            ${todayReqs.length > 0 ? `<button class="btn btn-secondary btn-sm" onclick="PrintService.openModal()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              Print Today
            </button>` : ""}
          </div>
          ${todayReqs.length === 0
            ? `<div class="empty-state" style="padding:32px 0;"><div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><h3>No IEPs today</h3><p>Enjoy the quiet!</p></div>`
            : todayReqs.map(r => iepCard(r, true)).join("")
          }
        </div>

        <!-- Quick upcoming -->
        <div>
          <div class="section-header">
            <h2 class="section-title">Next 7 Days</h2>
            <button class="btn btn-ghost btn-sm" onclick="App.navigate('upcoming')">View All →</button>
          </div>
          ${renderUpcomingList(upcoming.filter(r => r.Date > todayStr).slice(0, 5), true)}
        </div>
      </div>
    `;
  }

  // ── Upcoming View ────────────────────────────────────────────
  function renderUpcoming(container) {
    const { iepRequests } = App.getState();
    const todayStr = formatDateStr(new Date());
    const upcoming = iepRequests
      .filter(r => r.Date >= todayStr && r.Status !== "Cancelled")
      .sort((a, b) => a.Date.localeCompare(b.Date));

    container.innerHTML = `
      <div class="animate-in">
        <div class="section-header">
          <div>
            <h2 class="section-title">Upcoming IEP Dates</h2>
            <p class="section-subtitle">${upcoming.length} upcoming request${upcoming.length !== 1 ? "s" : ""}</p>
          </div>
          <button class="btn btn-primary btn-sm" onclick="App.navigate('new-iep')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Request
          </button>
        </div>
        ${upcoming.length === 0
          ? `<div class="empty-state"><div class="empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><h3>No upcoming IEPs</h3><p>Submit a new request to get started.</p><button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="App.navigate('new-iep')">New IEP Request</button></div>`
          : upcoming.map(r => iepCard(r, true)).join("")
        }
      </div>
    `;
  }

  // ── History View ─────────────────────────────────────────────
  function renderHistory(container) {
    const { iepRequests } = App.getState();
    const todayStr = formatDateStr(new Date());
    const past = iepRequests
      .filter(r => r.Date < todayStr)
      .sort((a, b) => b.Date.localeCompare(a.Date));

    container.innerHTML = `
      <div class="animate-in">
        <div class="section-header">
          <div>
            <h2 class="section-title">Past Records</h2>
            <p class="section-subtitle">${past.length} historical record${past.length !== 1 ? "s" : ""}</p>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th><th>Teacher</th><th>IEP Time</th><th>Periods</th>
                <th>Sub Assigned</th><th>Schedule</th><th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${past.length === 0
                ? `<tr><td colspan="7"><div class="empty-state" style="padding:32px 0;"><div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><h3>No past records yet</h3></div></td></tr>`
                : past.map(r => {
                    const periods = (r.Periods || "").split(",").filter(Boolean).sort((a,b)=>Number(a)-Number(b)).map(p => `P${p}`).join(", ");
                    const badge = r.Status === "Assigned"
                      ? `<span class="badge badge-green">${r.Status}</span>`
                      : r.Status === "Cancelled"
                      ? `<span class="badge badge-gray">${r.Status}</span>`
                      : `<span class="badge badge-amber">${r.Status || "Pending"}</span>`;
                    return `<tr>
                      <td><span class="date-display">${formatDisplayDate(r.Date)}</span></td>
                      <td>${r.TeacherName}</td>
                      <td style="font-family:var(--font-mono);">${r.IEPTime}</td>
                      <td style="font-family:var(--font-mono);">${periods}</td>
                      <td>${r.AssignedSubName || "—"}</td>
                      <td>${r.ScheduleType || "regular"}</td>
                      <td>${badge}</td>
                    </tr>`;
                  }).join("")
              }
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // ── New IEP ──────────────────────────────────────────────────
  function renderNewIEP(container) {
    IEPService.renderNewIEPForm(container);
  }

  // ── IEP Card ─────────────────────────────────────────────────
  function iepCard(req, showActions) {
    const { subs, scheduleTypes } = App.getState();
    const periods = (req.Periods || "").split(",").filter(Boolean).sort((a,b) => Number(a)-Number(b));
    const statusCls = req.Status === "Assigned" ? "status-assigned" : req.Status === "Cancelled" ? "status-cancelled" : "status-pending";
    const statusBadge = req.Status === "Assigned"
      ? `<span class="badge badge-green"><span class="badge-dot"></span>${req.Status}</span>`
      : req.Status === "Cancelled"
      ? `<span class="badge badge-gray"><span class="badge-dot"></span>${req.Status}</span>`
      : `<span class="badge badge-amber"><span class="badge-dot"></span>${req.Status || "Pending"}</span>`;

    const schedName = (scheduleTypes.find(s => s.ID === req.ScheduleType) || {}).Name || req.ScheduleType || "Regular";

    const subOptions = subs.map(s =>
      `<option value="${s.ID}" ${s.ID === req.AssignedSubID ? "selected" : ""}>${s.Name}</option>`
    ).join("");

    const periodTags = periods.map(p => `<span class="period-tag">P${p}</span>`).join("");

    return `
      <div class="iep-card ${statusCls}" style="margin-bottom:12px;">
        <div class="iep-card-header">
          <div>
            <div class="iep-teacher-name">${req.TeacherName}</div>
            <div class="iep-meta" style="margin-top:6px;">
              <span class="iep-meta-item">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                ${formatDisplayDate(req.Date)}
              </span>
              <span class="iep-meta-item">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                ${req.IEPTime}
              </span>
              <span class="iep-meta-item" style="color:var(--text-3);">${schedName}</span>
            </div>
          </div>
          ${statusBadge}
        </div>

        <div class="iep-periods-row">${periodTags}</div>

        ${req.AssignedSubName ? `<div style="font-size:13px;margin-bottom:12px;color:var(--green);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          Sub: <strong>${req.AssignedSubName}</strong>
        </div>` : `<div style="font-size:13px;margin-bottom:12px;color:var(--amber);">Sub not yet assigned</div>`}

        ${req.Notes ? `<div style="font-size:12px;color:var(--text-3);margin-bottom:12px;font-style:italic;">"${req.Notes}"</div>` : ""}

        ${showActions ? `
        <div class="iep-card-actions">
          <div style="display:flex;align-items:center;gap:8px;flex:1;">
            <select class="form-select" style="font-size:12px;padding:7px 10px;width:auto;flex:1;max-width:220px;" id="sub-sel-${req.ID}">
              <option value="">— Assign Sub —</option>
              ${subOptions}
            </select>
            <button class="btn btn-success btn-sm" onclick="UI.assignSub('${req.ID}')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              Assign
            </button>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="UI.editIEPRequest('${req.ID}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="UI.deleteIEPConfirm('${req.ID}','${req.TeacherName.replace(/'/g, "\\'")}')">Delete</button>
        </div>` : ""}
      </div>
    `;
  }

  function renderUpcomingList(reqs, compact) {
    if (reqs.length === 0) return `<div style="color:var(--text-3);font-size:13px;padding:12px 0;">Nothing coming up in the next 7 days.</div>`;
    return reqs.map(r => iepCard(r, !compact)).join("");
  }

  // ── Assign Sub inline ────────────────────────────────────────
  function assignSub(reqID) {
    const { iepRequests, subs } = App.getState();
    const req = iepRequests.find(r => r.ID === reqID);
    if (!req) return toast("Request not found.", "error");

    const selEl = document.getElementById("sub-sel-" + reqID);
    const subID = selEl ? selEl.value : "";
    const sub   = subs.find(s => s.ID === subID) || {};

    const updated = {
      ...req,
      AssignedSubID:   subID || "",
      AssignedSubName: sub.Name || "",
      Status: subID ? "Assigned" : "Pending",
    };

    IEPService.updateRequest(updated, () => App.navigate(App.getState().currentView));
  }

  // ── Edit IEP Request modal ───────────────────────────────────
  function editIEPRequest(reqID) {
    const { iepRequests, subs, scheduleTypes } = App.getState();
    const req = iepRequests.find(r => r.ID === reqID);
    if (!req) return toast("Not found.", "error");

    const subOptions = subs.map(s =>
      `<option value="${s.ID}" ${s.ID === req.AssignedSubID ? "selected" : ""}>${s.Name}</option>`
    ).join("");
    const schedOptions = scheduleTypes.map(s =>
      `<option value="${s.ID}" ${s.ID === req.ScheduleType ? "selected" : ""}>${s.Name}</option>`
    ).join("");

    openModalWith(`
      <h2 style="font-family:var(--font-display);font-size:20px;margin-bottom:20px;">Edit IEP Request</h2>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" class="form-input" id="edit-date" value="${req.Date}" />
        </div>
        <div class="form-group">
          <label class="form-label">IEP Time (displayed)</label>
          <input type="text" class="form-input" id="edit-time" value="${req.IEPTime}" placeholder="8:30 AM" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Schedule Type</label>
        <select class="form-select" id="edit-sched">${schedOptions}</select>
      </div>
      <div class="form-group">
        <label class="form-label">Periods (comma-separated)</label>
        <input type="text" class="form-input" id="edit-periods" value="${req.Periods}" placeholder="1,2,3" />
      </div>
      <div class="form-group">
        <label class="form-label">Assign Sub</label>
        <select class="form-select" id="edit-sub">
          <option value="">— Unassigned —</option>
          ${subOptions}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="edit-status">
          <option ${req.Status === "Pending"   ? "selected" : ""} value="Pending">Pending</option>
          <option ${req.Status === "Assigned"  ? "selected" : ""} value="Assigned">Assigned</option>
          <option ${req.Status === "Cancelled" ? "selected" : ""} value="Cancelled">Cancelled</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea class="form-textarea" id="edit-notes">${req.Notes || ""}</textarea>
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="btn btn-primary" style="flex:1" onclick="UI.saveEditedRequest('${reqID}')">Save Changes</button>
        <button class="btn btn-secondary" onclick="UI.closeModal()">Cancel</button>
      </div>
    `);
  }

  function saveEditedRequest(reqID) {
    const { iepRequests, subs } = App.getState();
    const req = iepRequests.find(r => r.ID === reqID);
    if (!req) return;

    const subID = document.getElementById("edit-sub").value;
    const sub   = subs.find(s => s.ID === subID) || {};

    const updated = {
      ...req,
      Date:            document.getElementById("edit-date").value,
      IEPTime:         document.getElementById("edit-time").value,
      ScheduleType:    document.getElementById("edit-sched").value,
      Periods:         document.getElementById("edit-periods").value,
      AssignedSubID:   subID,
      AssignedSubName: sub.Name || "",
      Status:          document.getElementById("edit-status").value,
      Notes:           document.getElementById("edit-notes").value,
    };

    closeModal();
    IEPService.updateRequest(updated, () => App.navigate(App.getState().currentView));
  }

  // ── Delete IEP ───────────────────────────────────────────────
  function deleteIEPConfirm(reqID, teacherName) {
    openModalWith(`
      <div style="text-align:center;padding:16px 0;">
        <div class="empty-icon" style="margin:0 auto 16px;color:var(--red);background:var(--red-dim);width:56px;height:56px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </div>
        <h2 style="font-size:18px;margin-bottom:8px;">Delete this request?</h2>
        <p style="color:var(--text-3);font-size:13px;margin-bottom:24px;">IEP request for <strong>${teacherName}</strong> will be permanently removed.</p>
        <div style="display:flex;gap:10px;justify-content:center;">
          <button class="btn btn-danger" onclick="UI.deleteIEP('${reqID}')">Delete</button>
          <button class="btn btn-secondary" onclick="UI.closeModal()">Cancel</button>
        </div>
      </div>
    `);
  }

  function deleteIEP(reqID) {
    closeModal();
    IEPService.deleteRequest(reqID, () => App.navigate(App.getState().currentView));
  }

  // ── Date Helpers ─────────────────────────────────────────────
  function formatDateStr(d) {
    const yyyy = d.getFullYear();
    const mm   = String(d.getMonth() + 1).padStart(2, "0");
    const dd   = String(d.getDate()).padStart(2, "0");
    return `${yyyy}-${mm}-${dd}`;
  }

  function formatDisplayDate(dateStr) {
    if (!dateStr) return "—";
    const d = new Date(dateStr + "T12:00:00");
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  }

  return {
    toast, openModalWith, closeModal, openPrintModal, toggleSidebar,
    renderDashboard, renderUpcoming, renderHistory, renderNewIEP,
    assignSub, editIEPRequest, saveEditedRequest,
    deleteIEPConfirm, deleteIEP,
    formatDateStr, formatDisplayDate,
  };

})();
</script>
