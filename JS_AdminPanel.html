<script>
/* ============================================================
   JS_AdminPanel.html — Admin Panel Views
   ============================================================ */

const AdminPanel = (() => {

  // ══════════════════════════════════════════════════════════════
  // PEOPLE — Teachers & Subs
  // ══════════════════════════════════════════════════════════════

  let _peopleTab = "teachers";

  function renderPeople(container) {
    container.innerHTML = `
      <div class="animate-in">
        <div class="section-header">
          <div>
            <h2 class="section-title">Teachers & On-Site Subs</h2>
            <p class="section-subtitle">Manage who's in the system</p>
          </div>
        </div>
        <div class="tabs">
          <div class="tab-btn ${_peopleTab === "teachers" ? "active" : ""}" onclick="AdminPanel.switchPeopleTab('teachers')">Teachers</div>
          <div class="tab-btn ${_peopleTab === "subs" ? "active" : ""}" onclick="AdminPanel.switchPeopleTab('subs')">On-Site Subs</div>
        </div>
        <div id="people-tab-content"></div>
      </div>
    `;
    renderPeopleTab();
  }

  function switchPeopleTab(tab) {
    _peopleTab = tab;
    document.querySelectorAll(".tab-btn").forEach(el => {
      el.classList.toggle("active", el.textContent.toLowerCase().includes(tab === "teachers" ? "teacher" : "sub"));
    });
    renderPeopleTab();
  }

  function renderPeopleTab() {
    const content = document.getElementById("people-tab-content");
    if (!content) return;
    const { teachers, subs } = App.getState();
    const isTeachers = _peopleTab === "teachers";
    const list = isTeachers ? teachers : subs;
    const label = isTeachers ? "Teacher" : "On-Site Sub";

    const rows = list.length ? list.map(p => `
      <tr>
        <td>${p.Name}</td>
        <td>${p.Email || "—"}</td>
        <td>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost btn-sm" onclick="AdminPanel.editPerson('${p.ID}','${isTeachers ? "teacher" : "sub"}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Edit
            </button>
            <button class="btn btn-danger btn-sm" onclick="AdminPanel.confirmDelete('${p.ID}','${isTeachers ? "teacher" : "sub"}','${p.Name.replace(/'/g, "\\'")}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              Remove
            </button>
          </div>
        </td>
      </tr>
    `).join("") : `<tr><td colspan="3"><div class="empty-state" style="padding:32px 0;"><div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><h3>No ${label}s yet</h3><p>Add your first ${label.toLowerCase()} below.</p></div></td></tr>`;

    content.innerHTML = `
      <div class="action-bar">
        <div class="search-bar" style="width:280px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Search ${label.toLowerCase()}s…" oninput="AdminPanel.filterTable(this.value,'people-table')" />
        </div>
        <button class="btn btn-primary btn-sm" onclick="AdminPanel.editPerson(null,'${isTeachers ? "teacher" : "sub"}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add ${label}
        </button>
      </div>
      <div class="table-wrap">
        <table id="people-table">
          <thead><tr><th>Name</th><th>Email</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  function editPerson(id, type) {
    const { teachers, subs } = App.getState();
    const list = type === "teacher" ? teachers : subs;
    const person = id ? list.find(p => p.ID === id) : null;
    const label  = type === "teacher" ? "Teacher" : "On-Site Sub";

    UI.openModalWith(`
      <h2 style="font-family:var(--font-display);font-size:20px;margin-bottom:20px;">${person ? "Edit" : "Add"} ${label}</h2>
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-input" id="person-name" value="${person ? person.Name : ""}" placeholder="Jane Smith" />
      </div>
      <div class="form-group">
        <label class="form-label">Email (optional)</label>
        <input type="email" class="form-input" id="person-email" value="${person ? (person.Email || "") : ""}" placeholder="jane@school.edu" />
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="btn btn-primary" style="flex:1" onclick="AdminPanel.savePerson('${id || ""}','${type}')">
          ${person ? "Save Changes" : `Add ${label}`}
        </button>
        <button class="btn btn-secondary" onclick="UI.closeModal()">Cancel</button>
      </div>
    `);
  }

  function savePerson(id, type) {
    const name  = document.getElementById("person-name").value.trim();
    const email = document.getElementById("person-email").value.trim();
    if (!name) return UI.toast("Name is required.", "warning");

    const obj = { ID: id || undefined, Name: name, Email: email, Active: true };
    const fn   = type === "teacher" ? TeacherService.saveTeacher : TeacherService.saveSub;

    UI.closeModal();
    fn(obj, () => renderPeople(document.getElementById("view-container")));
  }

  function confirmDelete(id, type, name) {
    UI.openModalWith(`
      <div style="text-align:center;padding:16px 0;">
        <div class="empty-icon" style="margin:0 auto 16px;color:var(--red);background:var(--red-dim);width:56px;height:56px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </div>
        <h2 style="font-size:18px;margin-bottom:8px;">Remove ${name}?</h2>
        <p style="color:var(--text-3);font-size:13px;margin-bottom:24px;">This will mark them inactive. IEP history is preserved.</p>
        <div style="display:flex;gap:10px;justify-content:center;">
          <button class="btn btn-danger" onclick="AdminPanel.deletePerson('${id}','${type}')">Yes, Remove</button>
          <button class="btn btn-secondary" onclick="UI.closeModal()">Cancel</button>
        </div>
      </div>
    `);
  }

  function deletePerson(id, type) {
    UI.closeModal();
    const fn = type === "teacher" ? TeacherService.deleteTeacher : TeacherService.deleteSub;
    fn(id, () => renderPeople(document.getElementById("view-container")));
  }

  // ══════════════════════════════════════════════════════════════
  // SCHEDULE — Schedule Types & Period Times
  // ══════════════════════════════════════════════════════════════

  function renderSchedule(container) {
    const { scheduleTypes } = App.getState();

    const schedCards = scheduleTypes.map(s => `
      <div class="card" style="margin-bottom:24px;">
        <div class="card-header">
          <div class="card-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ${s.Name}
          </div>
          <span class="badge badge-green"><span class="badge-dot"></span> Active</span>
        </div>
        <p style="font-size:12px;color:var(--text-3);margin-bottom:16px;">Configure period start and end times for this schedule type.</p>
        ${renderPeriodTimeEditor(s.ID)}
        <div style="margin-top:16px;">
          <button class="btn btn-primary btn-sm" onclick="AdminPanel.savePeriodTimes('${s.ID}')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save Period Times
          </button>
        </div>
      </div>
    `).join("");

    container.innerHTML = `
      <div class="animate-in">
        <div class="section-header">
          <div>
            <h2 class="section-title">Schedule & Period Times</h2>
            <p class="section-subtitle">Set start/end times for each period per schedule type</p>
          </div>
          <button class="btn btn-primary btn-sm" onclick="AdminPanel.addScheduleType()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Schedule Type
          </button>
        </div>
        ${schedCards || '<div class="empty-state"><p>No schedule types found. Initialize the spreadsheet first.</p></div>'}
      </div>
    `;
  }

  function renderPeriodTimeEditor(scheduleID) {
    const periods = ScheduleService.getPeriodsForSchedule(scheduleID);
    const rows = Array.from({ length: 7 }, (_, i) => {
      const p = i + 1;
      const entry = periods.find(pt => Number(pt.Period) === p);
      return `
        <div style="display:grid;grid-template-columns:40px 1fr 1fr;gap:10px;align-items:center;margin-bottom:8px;">
          <div style="font-family:var(--font-mono);font-weight:700;color:var(--accent);font-size:14px;">P${p}</div>
          <div>
            <input type="text" class="form-input form-input-sm" id="pt-${scheduleID}-${p}-start"
              value="${entry ? entry.StartTime : ""}" placeholder="8:00 AM" style="font-size:12px;padding:7px 10px;" />
          </div>
          <div>
            <input type="text" class="form-input form-input-sm" id="pt-${scheduleID}-${p}-end"
              value="${entry ? entry.EndTime : ""}" placeholder="8:52 AM" style="font-size:12px;padding:7px 10px;" />
          </div>
        </div>
      `;
    }).join("");

    return `
      <div style="background:var(--bg-3);border-radius:var(--radius-sm);padding:16px;">
        <div style="display:grid;grid-template-columns:40px 1fr 1fr;gap:10px;margin-bottom:10px;">
          <div></div>
          <div style="font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;">Start Time</div>
          <div style="font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;">End Time</div>
        </div>
        ${rows}
      </div>
    `;
  }

  function savePeriodTimes(scheduleID) {
    const periods = [];
    for (let p = 1; p <= 7; p++) {
      const startEl = document.getElementById(`pt-${scheduleID}-${p}-start`);
      const endEl   = document.getElementById(`pt-${scheduleID}-${p}-end`);
      const start   = startEl ? startEl.value.trim() : "";
      const end     = endEl   ? endEl.value.trim()   : "";
      if (start && end) {
        periods.push({ period: p, startTime: start, endTime: end });
      }
    }
    if (periods.length === 0) return UI.toast("No period times to save.", "warning");
    ScheduleService.savePeriodTimes(scheduleID, periods, () =>
      renderSchedule(document.getElementById("view-container"))
    );
  }

  function addScheduleType() {
    UI.openModalWith(`
      <h2 style="font-family:var(--font-display);font-size:20px;margin-bottom:20px;">New Schedule Type</h2>
      <div class="form-group">
        <label class="form-label">Schedule Name</label>
        <input type="text" class="form-input" id="sched-name" placeholder="e.g. Finals Week" />
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="btn btn-primary" style="flex:1" onclick="AdminPanel.saveNewScheduleType()">Add Schedule</button>
        <button class="btn btn-secondary" onclick="UI.closeModal()">Cancel</button>
      </div>
    `);
  }

  function saveNewScheduleType() {
    const name = document.getElementById("sched-name").value.trim();
    if (!name) return UI.toast("Name required.", "warning");
    UI.closeModal();
    ScheduleService.saveScheduleType({ Name: name, Active: true }, () =>
      renderSchedule(document.getElementById("view-container"))
    );
  }

  // ══════════════════════════════════════════════════════════════
  // MASTER SCHEDULE
  // ══════════════════════════════════════════════════════════════

  let _masterTeacherFilter = "";

  function renderMaster(container) {
    const { teachers, masterSchedule } = App.getState();

    const teacherOptions = teachers.map(t => `<option value="${t.ID}">${t.Name}</option>`).join("");

    // Build master schedule table grouped by teacher
    const byTeacher = {};
    masterSchedule.forEach(row => {
      if (!byTeacher[row.TeacherID]) byTeacher[row.TeacherID] = { name: row.TeacherName, rows: [] };
      byTeacher[row.TeacherID].rows.push(row);
    });

    const filteredTeachers = _masterTeacherFilter
      ? teachers.filter(t => t.ID === _masterTeacherFilter)
      : teachers;

    const tableRows = filteredTeachers.flatMap(t => {
      const data = byTeacher[t.ID] || { name: t.Name, rows: [] };
      if (data.rows.length === 0) {
        return [`<tr>
          <td style="font-weight:700;">${t.Name}</td>
          <td colspan="3" style="color:var(--text-3);font-style:italic;">No schedule entries</td>
          <td><button class="btn btn-primary btn-sm" onclick="AdminPanel.addMasterRow('${t.ID}','${t.Name.replace(/'/g, "\\'")}')">+ Add Period</button></td>
        </tr>`];
      }
      return data.rows.sort((a,b) => Number(a.Period) - Number(b.Period)).map((r, i) => {
        const isCovered = (r.CourseName || "").toUpperCase() !== "PREP" &&
          !["CO-TEACHER","COTEACHER","CO TEACHER"].includes((r.RoleType || "").toUpperCase());
        const badge = isCovered
          ? `<span class="badge badge-green">Teaching</span>`
          : `<span class="badge badge-gray">Excluded</span>`;
        return `<tr>
          <td style="font-weight:700;">${i === 0 ? t.Name : ""}</td>
          <td style="font-family:var(--font-mono);font-weight:600;">P${r.Period}</td>
          <td>${r.CourseName || "—"}</td>
          <td>${r.RoleType || "—"}</td>
          <td>${badge}</td>
          ${i === 0 ? `<td rowspan="${data.rows.length}" style="vertical-align:top;padding-top:12px;">
            <button class="btn btn-ghost btn-sm" onclick="AdminPanel.addMasterRow('${t.ID}','${t.Name.replace(/'/g, "\\'")}')">+ Period</button>
            <button class="btn btn-danger btn-sm" style="margin-top:4px;" onclick="AdminPanel.confirmClearSchedule('${t.ID}','${t.Name.replace(/'/g, "\\'")}')">Clear All</button>
          </td>` : ""}
        </tr>`;
      });
    }).join("");

    container.innerHTML = `
      <div class="animate-in">
        <div class="section-header">
          <div>
            <h2 class="section-title">Master Schedule</h2>
            <p class="section-subtitle">Configure which periods each teacher teaches (PREP & Co-Teacher roles are auto-excluded)</p>
          </div>
          <button class="btn btn-primary btn-sm" onclick="AdminPanel.addMasterRow('','')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Entry
          </button>
        </div>

        <div class="action-bar" style="margin-bottom:16px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <label class="form-label" style="white-space:nowrap;margin:0;">Filter Teacher:</label>
            <select class="form-select" style="width:220px;" onchange="AdminPanel.filterMaster(this.value)">
              <option value="">All Teachers</option>
              ${teacherOptions}
            </select>
          </div>
          <div style="display:flex;gap:8px;font-size:12px;color:var(--text-3);align-items:center;">
            <span class="badge badge-green">Teaching</span> = included in sub coverage &nbsp;
            <span class="badge badge-gray">Excluded</span> = PREP or Co-Teacher
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Teacher</th><th>Period</th><th>Course</th><th>Role</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${tableRows || `<tr><td colspan="6"><div class="empty-state" style="padding:32px 0;">
                <div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg></div>
                <h3>No master schedule data</h3><p>Add entries for each teacher's periods.</p>
              </div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;

    if (_masterTeacherFilter) {
      const sel = container.querySelector("select");
      if (sel) sel.value = _masterTeacherFilter;
    }
  }

  function filterMaster(teacherID) {
    _masterTeacherFilter = teacherID;
    renderMaster(document.getElementById("view-container"));
  }

  function addMasterRow(teacherID, teacherName) {
    const { teachers } = App.getState();
    const teacherOptions = teachers.map(t =>
      `<option value="${t.ID}" ${t.ID === teacherID ? "selected" : ""}>${t.Name}</option>`
    ).join("");

    UI.openModalWith(`
      <h2 style="font-family:var(--font-display);font-size:20px;margin-bottom:20px;">Add Schedule Entry</h2>
      <div class="form-group">
        <label class="form-label">Teacher</label>
        <select class="form-select" id="ms-teacher">
          <option value="">— Select —</option>
          ${teacherOptions}
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Period (1–7)</label>
          <input type="number" class="form-input" id="ms-period" min="1" max="7" placeholder="1" />
        </div>
        <div class="form-group">
          <label class="form-label">Role Type</label>
          <select class="form-select" id="ms-role">
            <option value="Teacher">Teacher (Main)</option>
            <option value="Co-Teacher">Co-Teacher</option>
            <option value="PREP">PREP</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Course Name</label>
        <input type="text" class="form-input" id="ms-course" placeholder="e.g. Algebra 1, PREP" />
        <span class="form-hint">Enter "PREP" to mark as prep period (auto-excluded from sub coverage)</span>
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="btn btn-primary" style="flex:1" onclick="AdminPanel.saveMasterRow()">Add Entry</button>
        <button class="btn btn-secondary" onclick="UI.closeModal()">Cancel</button>
      </div>
    `);
  }

  function saveMasterRow() {
    const teacherID  = document.getElementById("ms-teacher").value;
    const period     = document.getElementById("ms-period").value;
    const course     = document.getElementById("ms-course").value.trim();
    const role       = document.getElementById("ms-role").value;

    if (!teacherID) return UI.toast("Select a teacher.", "warning");
    if (!period)    return UI.toast("Enter a period.", "warning");
    if (!course)    return UI.toast("Enter a course name.", "warning");

    const { teachers } = App.getState();
    const teacher = teachers.find(t => t.ID === teacherID);

    UI.closeModal();
    TeacherService.saveMasterRow({
      TeacherID: teacherID,
      TeacherName: teacher ? teacher.Name : "",
      Period: Number(period),
      CourseName: course,
      RoleType: role,
    }, () => renderMaster(document.getElementById("view-container")));
  }

  function confirmClearSchedule(teacherID, name) {
    UI.openModalWith(`
      <div style="text-align:center;padding:16px 0;">
        <div class="empty-icon" style="margin:0 auto 16px;color:var(--red);background:var(--red-dim);width:56px;height:56px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </div>
        <h2 style="font-size:18px;margin-bottom:8px;">Clear ${name}'s schedule?</h2>
        <p style="color:var(--text-3);font-size:13px;margin-bottom:24px;">All period entries for this teacher will be deleted.</p>
        <div style="display:flex;gap:10px;justify-content:center;">
          <button class="btn btn-danger" onclick="AdminPanel.clearSchedule('${teacherID}')">Yes, Clear</button>
          <button class="btn btn-secondary" onclick="UI.closeModal()">Cancel</button>
        </div>
      </div>
    `);
  }

  function clearSchedule(teacherID) {
    UI.closeModal();
    TeacherService.clearTeacherSchedule(teacherID, () =>
      renderMaster(document.getElementById("view-container"))
    );
  }

  // ── Table filter helper ───────────────────────────────────────
  function filterTable(query, tableID) {
    const table = document.getElementById(tableID);
    if (!table) return;
    const q = query.toLowerCase();
    table.querySelectorAll("tbody tr").forEach(row => {
      const text = row.textContent.toLowerCase();
      row.style.display = text.includes(q) ? "" : "none";
    });
  }

  return {
    renderPeople, switchPeopleTab,
    editPerson, savePerson, confirmDelete, deletePerson,
    renderSchedule, savePeriodTimes, addScheduleType, saveNewScheduleType,
    renderMaster, filterMaster, addMasterRow, saveMasterRow,
    confirmClearSchedule, clearSchedule,
    filterTable,
  };

})();
</script>
