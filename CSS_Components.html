<style>
/* ============================================================
   CSS_Components.html — IEP Sub Tracker | Component Styles
   ============================================================ */

/* ── Cards ──────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  transition: border-color var(--transition);
}
.card:hover { border-color: var(--border-2); }

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-title svg { color: var(--accent); }

.card-subtitle {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 2px;
}

/* ── Stat Cards ─────────────────────────────────────────────── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  position: relative;
  overflow: hidden;
  transition: all var(--transition);
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
  opacity: 0;
  transition: opacity var(--transition);
}
.stat-card:hover { border-color: var(--border-2); }
.stat-card:hover::before { opacity: 1; }

.stat-card.accent::before  { background: var(--accent); opacity: 1; }
.stat-card.green::before   { background: var(--green);  opacity: 1; }
.stat-card.amber::before   { background: var(--amber);  opacity: 1; }
.stat-card.purple::before  { background: var(--purple); opacity: 1; }

.stat-icon {
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
  background: var(--accent-dim);
  color: var(--accent);
}
.stat-icon.green  { background: var(--green-dim);  color: var(--green); }
.stat-icon.amber  { background: var(--amber-dim);  color: var(--amber); }
.stat-icon.purple { background: var(--purple-dim); color: var(--purple); }

.stat-value {
  font-size: 30px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.03em;
  line-height: 1;
  margin-bottom: 4px;
}

.stat-label {
  font-size: 12px;
  color: var(--text-3);
  font-weight: 500;
  letter-spacing: 0.02em;
}

/* ── Buttons ────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  transition: all var(--transition);
  cursor: pointer;
  border: 1px solid transparent;
  white-space: nowrap;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 12px rgba(79,142,247,0.3);
}
.btn-primary:hover:not(:disabled) {
  background: #6ba3fa;
  box-shadow: var(--shadow-accent);
  transform: translateY(-1px);
}
.btn-primary:active { transform: translateY(0); }

.btn-secondary {
  background: var(--bg-3);
  color: var(--text-2);
  border-color: var(--border-2);
}
.btn-secondary:hover:not(:disabled) {
  background: var(--bg-4);
  color: var(--text);
  border-color: var(--accent);
}

.btn-danger {
  background: var(--red-dim);
  color: var(--red);
  border-color: rgba(239,68,68,0.3);
}
.btn-danger:hover:not(:disabled) {
  background: var(--red);
  color: #fff;
}

.btn-success {
  background: var(--green-dim);
  color: var(--green);
  border-color: rgba(46,204,113,0.3);
}
.btn-success:hover:not(:disabled) {
  background: var(--green);
  color: #fff;
}

.btn-ghost {
  color: var(--text-2);
  padding: 8px 12px;
}
.btn-ghost:hover { color: var(--text); background: var(--bg-3); }

.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-lg { padding: 13px 24px; font-size: 15px; }
.btn-icon { padding: 8px; border-radius: var(--radius-sm); }

/* ── Forms ──────────────────────────────────────────────────── */
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}

.form-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.form-input, .form-select, .form-textarea {
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px;
  padding: 10px 14px;
  transition: all var(--transition);
  width: 100%;
  outline: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent);
  background: var(--bg-2);
  box-shadow: 0 0 0 3px var(--accent-dim);
}
.form-input::placeholder { color: var(--text-3); }
.form-select { cursor: pointer; }
.form-select option { background: var(--bg-2); }
.form-textarea { resize: vertical; min-height: 80px; }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

.form-hint {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 2px;
}
.form-error {
  font-size: 11px;
  color: var(--red);
  margin-top: 2px;
}

/* ── Tables ─────────────────────────────────────────────────── */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

thead th {
  background: var(--bg-3);
  padding: 12px 16px;
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
}

tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background var(--transition);
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--bg-3); }

td {
  padding: 12px 16px;
  color: var(--text-2);
  vertical-align: middle;
}
td:first-child { color: var(--text); font-weight: 500; }

/* ── Badges ─────────────────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.03em;
  white-space: nowrap;
}
.badge-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.badge-green  { background: var(--green-dim);  color: var(--green); }
.badge-amber  { background: var(--amber-dim);  color: var(--amber); }
.badge-red    { background: var(--red-dim);    color: var(--red); }
.badge-accent { background: var(--accent-dim); color: var(--accent); }
.badge-purple { background: var(--purple-dim); color: var(--purple); }
.badge-gray   { background: var(--bg-4);       color: var(--text-3); }

/* ── Period Grid ────────────────────────────────────────────── */
.period-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  margin: 12px 0;
}

.period-cell {
  border: 2px solid var(--border-2);
  border-radius: var(--radius-sm);
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
  position: relative;
}

.period-cell:hover {
  border-color: var(--accent);
  background: var(--accent-dim);
}

.period-cell.selected {
  border-color: var(--accent);
  background: var(--accent-dim);
  color: var(--accent);
}

.period-cell.highlighted {
  border-color: var(--amber);
  background: var(--amber-dim);
  animation: pulseHighlight 1.5s ease-in-out 2;
}

.period-cell.highlighted.selected {
  border-color: var(--green);
  background: var(--green-dim);
  color: var(--green);
}

.period-cell.unavailable {
  opacity: 0.35;
  cursor: not-allowed;
  border-style: dashed;
}

.period-num {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  display: block;
}
.period-time {
  font-size: 10px;
  color: var(--text-3);
  font-family: var(--font-mono);
  display: block;
  margin-top: 3px;
}
.period-label {
  font-size: 10px;
  color: var(--text-3);
  display: block;
  margin-top: 3px;
  font-weight: 500;
}

@keyframes pulseHighlight {
  0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); }
  50% { box-shadow: 0 0 0 4px rgba(245,158,11,0.3); }
}

/* ── IEP Request Cards ──────────────────────────────────────── */
.iep-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}
.iep-card:hover {
  border-color: var(--border-2);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.iep-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent);
}
.iep-card.status-pending::before  { background: var(--amber); }
.iep-card.status-assigned::before { background: var(--green); }
.iep-card.status-cancelled::before { background: var(--text-3); }

.iep-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.iep-teacher-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

.iep-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}

.iep-meta-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text-2);
}
.iep-meta-item svg { color: var(--text-3); }

.iep-periods-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}

.period-tag {
  padding: 3px 10px;
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  font-family: var(--font-mono);
}

.iep-card-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* ── Empty States ───────────────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 60px 20px;
  color: var(--text-3);
  text-align: center;
}

.empty-icon {
  width: 56px; height: 56px;
  background: var(--bg-3);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
  margin-bottom: 4px;
}

.empty-state h3 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-2);
}

.empty-state p {
  font-size: 13px;
  max-width: 280px;
}

/* ── Section Headers ────────────────────────────────────────── */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.section-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: -0.02em;
}

.section-subtitle {
  font-size: 13px;
  color: var(--text-3);
  margin-top: 3px;
}

/* ── Tabs ───────────────────────────────────────────────────── */
.tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--bg-3);
  border-radius: var(--radius-sm);
  margin-bottom: 24px;
  width: fit-content;
}

.tab-btn {
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-3);
  transition: all var(--transition);
  cursor: pointer;
}
.tab-btn:hover { color: var(--text-2); }
.tab-btn.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

/* ── Toggle / Switch ────────────────────────────────────────── */
.toggle-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}

.toggle {
  position: relative;
  width: 42px; height: 24px;
  flex-shrink: 0;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0;
  background: var(--bg-4);
  border: 1px solid var(--border-2);
  border-radius: 20px;
  cursor: pointer;
  transition: all var(--transition);
}
.toggle-slider::before {
  content: '';
  position: absolute;
  left: 3px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  background: var(--text-3);
  border-radius: 50%;
  transition: all var(--transition);
}
.toggle input:checked + .toggle-slider { background: var(--accent-dim); border-color: var(--accent); }
.toggle input:checked + .toggle-slider::before { transform: translate(18px, -50%); background: var(--accent); }

/* ── Divider ────────────────────────────────────────────────── */
.divider {
  height: 1px;
  background: var(--border);
  margin: 20px 0;
}

/* ── Print Sheet Styles ─────────────────────────────────────── */
.print-sheet {
  background: #fff;
  color: #111;
  padding: 32px;
  font-family: var(--font-body);
  max-width: 800px;
  margin: 0 auto;
}

.print-sheet table {
  width: 100%;
  border-collapse: collapse;
}
.print-sheet th, .print-sheet td {
  border: 1px solid #ccc;
  padding: 10px 12px;
  text-align: left;
  color: #111;
  font-size: 13px;
}
.print-sheet th {
  background: #1a1a2e;
  color: #fff;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.print-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 2px solid #1a1a2e;
}
.print-header h2 { font-size: 22px; font-weight: 700; }
.print-header p { font-size: 13px; color: #444; margin-top: 4px; }

.pill-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

/* ── Date Input ─────────────────────────────────────────────── */
.date-display {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--accent);
  background: var(--accent-dim);
  padding: 4px 10px;
  border-radius: 6px;
}

/* ── Search Bar ─────────────────────────────────────────────── */
.search-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-sm);
  padding: 0 14px;
  transition: all var(--transition);
}
.search-bar:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}
.search-bar input {
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 14px;
  padding: 10px 0;
  width: 100%;
}
.search-bar svg { color: var(--text-3); flex-shrink: 0; }

/* ── Action Bar ─────────────────────────────────────────────── */
.action-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
</style>
